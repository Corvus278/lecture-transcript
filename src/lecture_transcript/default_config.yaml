# Дефолтная конфигурация пайплайна lecture-transcript.
#
# Этот файл — единственный источник дефолтов. Пользовательский YAML,
# переданный через --config, накладывается поверх посекционно.
# Неизвестные секции и ключи считаются ошибкой конфигурации.
#
# Значения, помеченные ПЛЕЙСХОЛДЕР, ещё подбираются на эталонной записи
# (задача 7.6) и здесь стоят как безопасная отправная точка.
#
# Дефолты dataclass в config.py обязаны совпадать с этим файлом —
# сверяется тестом test_dataclass_defaults_match_yaml.

# Приём медиа: две независимые корневые стадии — `audio` (WAV 16 кГц моно)
# и `frames` (кадры видео). Параметры одной не инвалидируют артефакт другой.
media_ingest:
  # Частота выборки кадров, кадр/с (design D7: 1 fps на 91-минутной записи).
  frames_fps: 1.0
  # Аппаратное декодирование: auto | cuda | videotoolbox | none.
  # На целевой машине (WSL2 + RTX 4060) — cuda, на macOS — videotoolbox.
  hwaccel: auto
  # Индекс аудиодорожки в контейнере; null — первая подходящая.
  audio_track: null
  # Частота дискретизации нормализованного аудио (контракт AudioArtifact).
  # Моно не настраивается: сведение каналов зафиксировано контрактом.
  audio_sample_rate: 16000

# Детект области демонстрации и дедупликация слайдов (стадия slides).
slide_extraction:
  # Сколько кадров сэмплировать для расчёта per-pixel дисперсии (design D3).
  variance_sample_frames: 100
  # Длина скользящего окна анализа раскладки, с.
  variance_window_s: 300.0
  # Минимальная доля площади кадра, ниже которой регион не считается
  # областью демонстрации.
  min_region_area_ratio: 0.05
  # Минимальная длительность интервала стабильной раскладки, с.
  min_layout_interval_s: 20.0
  # Короче этого пробела «демонстрация выключена» считается сбоем детекта,
  # с: он не режет ни интервал раскладки, ни слайд (один тёмный кадр не
  # порождает лишний слайд и секунду «вне слайдов»). Гасится только
  # одиночный кадр:
  # на эталоне демонстрация пропадает 45 раз (3..60 с) — при каждой смене
  # слайда платформа снимает её, и тайлы перестраиваются на весь кадр, —
  # и по длительности эти пропадания не отделимы от «настоящего» выключения
  # 2399..2412 (13 с): после него область возвращается на то же место
  # (IoU 1.0), как и после смены слайда. Самое короткое пропадание — 3 с,
  # одно-двухкадровых нет; 2 с ошибаются в сторону лишнего разреза.
  min_absence_s: 2.0
  # Пороги детекта области демонстрации (design D3): максимальный разброс
  # яркости пикселя во времени и минимальная средняя яркость области.
  # Их правят под другой шаблон вебинара или тёмные слайды.
  max_spread: 8.0
  min_brightness: 150.0
  # Размер perceptual hash: 16 -> хэш 16x16 = 256 бит. Порог ниже измеряется
  # в битах именно этого хэша, поэтому значения меняются только вместе.
  hash_size: 16
  # Порог hamming distance между perceptual hash (hash_size=16, 256 бит)
  # соседних кадров, выше которого начинается новый логический слайд.
  # Подобран на эталонной записи (задача 3.7) по кропу всей плитки
  # демонстрации (с рамкой шаблона). Дописывание маркером внутри
  # непрерывного показа даёт до 30; самая слабая настоящая смена слайда —
  # 56 (t=676 -> 681). Середина зазора 30|56 — 43; design D4/Risks требует
  # не заходить выше середины, в сторону склейки, поэтому 43, а не 44.
  # Любой порог 31..46 даёт одни и те же 53 группы, склеек нет ни одной;
  # 46 и 52 — это сдвиг окна демонстрации на том же слайде (лишний разрез,
  # безопасно). Разрез по провалу демонстрации делается всегда, независимо
  # от порога.
  hamming_threshold: 43
  # Область демонстрации вручную: [x, y, width, height] в пикселях кадра.
  # null — автодетект по временной дисперсии (design D3). Задаётся, когда
  # детект ошибается (design, Risks: статичная заставка, тёмные слайды).
  # Из командной строки: --slide-region X,Y,W,H (или auto).
  region: null

# Распознавание содержимого слайдов и глоссарий (стадии ocr, glossary).
slide_ocr:
  # Имя OCR-бэкенда из реестра slide_ocr.registry.
  backend: hybrid
  # ПЛЕЙСХОЛДЕР (задача 7.6): порог confidence, ниже которого фрагмент
  # помечается неуверенным (low_confidence) и уходит в формульный
  # распознаватель. Подбирается эмпирически на эталонной записи.
  confidence_threshold: 0.6
  # Доля неуверенных фрагментов, при которой весь слайд помечается unreliable.
  # Значения ниже совпадают с дефолтами реализаций (slide_ocr.assemble,
  # slide_ocr.glossary) — сверяется тестом test_yaml_matches_stage_defaults.
  unreliable_fragment_ratio: 0.5
  # Глоссарий: минимальная длина термина и потолок числа терминов.
  glossary_min_term_length: 4
  glossary_max_terms: 500
  # Надписи оформления платформы, которые не должны попасть в глоссарий.
  glossary_stopwords: []

# Детекция речи, ASR и пунктуация (стадии vad, asr, punctuation).
speech_transcription:
  # Имя ASR-бэкенда из реестра speech_transcription.registry.
  asr_backend: gigaam-v2
  # Имя VAD-бэкенда.
  vad_backend: silero
  # Порог вероятности речи VAD.
  vad_threshold: 0.5
  # Пауза, с которой тишина считается разрывом речи, с.
  min_silence_s: 1.0
  # Минимальная длительность интервала речи, с.
  min_speech_s: 0.2
  # Поля по краям интервала речи, с (чтобы не срезать начало слова).
  speech_pad_s: 0.15
  # Восстановление пунктуации: auto — только для бэкендов с
  # provides_punctuation=False (design D6); always | never — принудительно.
  punctuation: auto
  # Передавать ли глоссарий в ASR как hotwords / initial_prompt (design D2).
  use_glossary: true

# Слияние по времени и генерация transcript.md (стадия merge).
transcript_assembly:
  # ПЛЕЙСХОЛДЕР (задача 7.6): допуск на границах секций, с. Фраза, идущая
  # через границу слайда, не разрывается, если пересечение меньше допуска.
  # Подбирается на эталонной записи.
  section_boundary_tolerance_s: 2.0
  # Секция «Речь вне слайдов» короче порога, с, присоединяется к соседнему
  # слайду; 0 выключает. На эталоне провалы демонстрации при смене слайда
  # длятся 3–13 с, а самая короткая настоящая речь без слайда — 26 с
  # (DECISIONS 8.3.2): 15 с отсекает первые с запасом и не задевает вторую.
  short_offslide_section_s: 15.0
  # Пауза, по которой речь делится на абзацы, с.
  paragraph_pause_s: 2.5
  # Промежуточный таймкод внутри длинной секции, с.
  timecode_every_s: 120.0
  # Консервативная чистка филлеров и оборванных самоповторов.
  filler_cleanup: true
  # Имя итогового файла в выходном каталоге.
  output_filename: transcript.md

# Кэш промежуточных артефактов (design D8).
cache:
  # Каталог кэша; относительный путь считается от выходного каталога.
  directory: .cache
  # Способ определения идентичности входного файла:
  #   stat    — путь + размер + mtime (быстро, дефолт)
  #   sample  — размер + хэш первого/среднего/последнего чанка
  #   content — потоковый sha256 всего файла (медленно на 830 МБ)
  identity: stat
